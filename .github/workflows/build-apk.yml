name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare web assets in www/
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/index.html
          elif [ -f "HSC___SSC_English_Writing_Hub.html" ]; then
            cp HSC___SSC_English_Writing_Hub.html www/index.html
          else
            echo "Missing index.html or HSC___SSC_English_Writing_Hub.html"
            exit 1
          fi

      - name: Initialize Capacitor and Android project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "NCTB Writing Hub" "com.nctb.writinghub" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nctb-writing-hub-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
